services:
  redis:
    image: redis:7-alpine
    container_name: talklite-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    # 순수 인메모리 휘발 모드 (서버/컨테이너 종료 시 임시 방 데이터 즉시 증발)
    command: redis-server --save "" --appendonly no

  mariadb:
    image: mariadb:11
    container_name: talklite-mariadb
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MARIADB_ROOT_PASSWORD: rootpassword
      MARIADB_DATABASE: talklite
      MARIADB_USER: talklite
      MARIADB_PASSWORD: talklitepassword
    volumes:
      - mariadb-data:/var/lib/mysql

volumes:
  mariadb-data:
    driver: local