spring:
  application:
    name: talklite
  data:
    redis:
      host: localhost
      port: 6379
      # standalone 단일 노드 모드 (Lua 실행/Lettuce 설정 충돌 방지, NFR-SCALE-02)
  datasource:
    url: jdbc:mariadb://localhost:3306/talklite
    username: talklite
    password: talklitepassword
    driver-class-name: org.mariadb.jdbc.Driver
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

server:
  port: 8080
