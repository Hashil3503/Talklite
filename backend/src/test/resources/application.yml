spring:
  data:
    redis:
      host: localhost
      port: 6379
      database: 1
  datasource:
    url: jdbc:mariadb://localhost:3306/talklite_test
    username: talklite
    password: talklitepassword
    driver-class-name: org.mariadb.jdbc.Driver
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql

# T-H4: 테스트에서는 퇴장 유예 시간을 2초로 단축한다
talklite:
  presence:
    grace-seconds: 2
    # 기동 스윕이 테스트 도중 다른 테스트의 멤버를 제거하지 않도록 충분히 크게 둔다 (스윕은 직접 호출로 검증)
    startup-sweep-seconds: 3600
