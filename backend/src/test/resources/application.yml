spring:
  data:
    redis:
      host: localhost
      port: 6379
      database: 1
  datasource:
    url: jdbc:mariadb://localhost:3306/talklite_test
    username: talklite
    password: talklitepassword
    driver-class-name: org.mariadb.jdbc.Driver
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql

# T-H4: 테스트에서는 퇴장 유예 시간을 2초로 단축한다
talklite:
  presence:
    grace-seconds: 2
